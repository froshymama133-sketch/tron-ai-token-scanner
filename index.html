<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LionX TRON Scanner V4</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
}

header {
  text-align: center;
  padding: 25px 10px;
}

h1 {
  color: #00ffcc;
}

.subtitle {
  color: #aabbcc;
}

.card {
  background: #142438;
  padding: 22px;
  border-radius: 16px;
  margin-bottom: 20px;
  border: 1px solid #28435b;
}

input {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  margin: 12px 0;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  background: #00ffcc;
  color: #07111f;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.info {
  padding: 12px;
  background: #0b1b2b;
  border-radius: 8px;
  margin: 10px 0;
  overflow-wrap: anywhere;
}

.label {
  color: #91a9bd;
  font-size: 13px;
}

.value {
  margin-top: 6px;
  font-weight: bold;
}

.warning {
  color: #ffcc66;
}

.success {
  color: #00ffcc;
}

.error {
  color: #ff7777;
}

a {
  color: #00ffcc;
}

footer {
  text-align: center;
  color: #91a9bd;
  padding: 20px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>🦁 LionX Scanner V4</h1>
<p class="subtitle">
TRON Token Research Dashboard
</p>
</header>

<div class="card">

<h2>🔍 Research TRC-20 Token</h2>

<p>
Enter a TRON token contract address.
</p>

<input
id="address"
placeholder="TRON contract address"
autocomplete="off"
>

<button id="scanBtn" onclick="scanToken()">
Research Token
</button>

<p id="status"></p>

</div>

<div id="results" hidden>

<div class="card">
<h2>🪙 Token Information</h2>
<div id="tokenInfo"></div>
</div>

<div class="card">
<h2>🛡️ Security Research</h2>
<div id="securityInfo"></div>
</div>

<div class="card">
<h2>🔗 Blockchain Explorer</h2>
<div id="explorerInfo"></div>
</div>

</div>

<footer>
LionX Marketplace © 2026
<br>
Blockchain Research Tools
<br><br>
Research only. Not financial advice.
</footer>

</div>

<script>

const API = "https://api.trongrid.io";

const OWNER =
"TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

const statusBox =
document.getElementById("status");

const results =
document.getElementById("results");

function setStatus(message, className = "") {
  statusBox.textContent = message;
  statusBox.className = className;
}

function addInfo(container, label, value) {
  const box = document.createElement("div");
  box.className = "info";

  const title = document.createElement("div");
  title.className = "label";
  title.textContent = label;

  const content = document.createElement("div");
  content.className = "value";
  content.textContent = String(value);

  box.appendChild(title);
  box.appendChild(content);
  container.appendChild(box);
}

function decodeString(hex) {
  if (!hex) return "Unavailable";

  try {
    let data = hex;

    if (hex.length >= 128) {
      const offset = Number(
        BigInt("0x" + hex.slice(0, 64))
      ) * 2;

      if (offset + 64 <= hex.length) {
        const length = Number(
          BigInt(
            "0x" +
            hex.slice(offset, offset + 64)
          )
        );

        data = hex.slice(
          offset + 64,
          offset + 64 + length * 2
        );
      }
    }

    const bytes = new Uint8Array(
      (data.match(/.{2}/g) || [])
      .map(x => parseInt(x, 16))
    );

    return new TextDecoder()
      .decode(bytes)
      .replace(/\0/g, "")
      .trim() || "Unavailable";

  } catch {
    return "Unavailable";
  }
}

async function postAPI(path, body) {
  const response = await fetch(API + path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    throw new Error(
      "TRON API returned " + response.status
    );
  }

  return response.json();
}

async function callContract(address, method) {

  const data = await postAPI(
    "/wallet/triggerconstantcontract",
    {
      owner_address: OWNER,
      contract_address: address,
      function_selector: method,
      parameter: "",
      visible: true
    }
  );

  if (
    data.result?.result === false ||
    !data.constant_result?.[0]
  ) {
    throw new Error(
      "Cannot read " + method
    );
  }

  return data.constant_result[0];
}

async function getContract(address) {
  return postAPI("/wallet/getcontract", {
    value: address,
    visible: true
  });
}

function formatSupply(raw, decimals) {
  if (raw === null || decimals === null) {
    return "Unavailable";
  }

  if (
    !Number.isInteger(decimals) ||
    decimals < 0 ||
    decimals > 255
  ) {
    return "Unavailable";
  }

  const value = raw.toString();

  if (decimals === 0) return value;

  const padded = value.padStart(
    decimals + 1, "0"
  );

  const whole = padded.slice(0, -decimals);

  const fraction = padded
    .slice(-decimals)
    .replace(/0+$/, "");

  return fraction
    ? whole + "." + fraction
    : whole;
}

async function scanToken() {

  const address = document
    .getElementById("address")
    .value.trim();

  const button =
    document.getElementById("scanBtn");

  const tokenInfo =
    document.getElementById("tokenInfo");

  const securityInfo =
    document.getElementById("securityInfo");

  const explorerInfo =
    document.getElementById("explorerInfo");

  results.hidden = true;

  tokenInfo.replaceChildren();
  securityInfo.replaceChildren();
  explorerInfo.replaceChildren();

  if (
    !/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(address)
  ) {
    setStatus(
      "❌ Enter a TRON-format address.",
      "error"
    );
    return;
  }

  button.disabled = true;

  setStatus("🔍 Researching token...");

  try {

    const methods = [
      "name()",
      "symbol()",
      "decimals()",
      "totalSupply()"
    ];

    const calls = await Promise.allSettled(
      methods.map(method =>
        callContract(address, method)
      )
    );

    const contractCheck =
      await Promise.allSettled([
        getContract(address)
      ]);

    const values = calls.map(item =>
      item.status === "fulfilled"
        ? item.value
        : null
    );

    if (values.every(v => v === null)) {
      throw new Error(
        "Unable to read TRC-20 token data."
      );
    }

    const name = values[0]
      ? decodeString(values[0])
      : "Unavailable";

    const symbol = values[1]
      ? decodeString(values[1])
      : "Unavailable";

    let decimals = null;
    let supply = null;

    try {
      if (values[2]) {
        const d = BigInt("0x" + values[2]);
        if (d <= 255n) {
          decimals = Number(d);
        }
      }
    } catch {}

    try {
      if (values[3]) {
        supply = BigInt("0x" + values[3]);
      }
    } catch {}

    addInfo(tokenInfo, "Token Name", name);
    addInfo(tokenInfo, "Symbol", symbol);

    addInfo(
      tokenInfo,
      "Decimals",
      decimals === null
        ? "Unavailable"
        : decimals
    );

    addInfo(
      tokenInfo,
      "Total Supply",
      formatSupply(supply, decimals)
    );

    addInfo(
      tokenInfo,
      "Contract Address",
      address
    );

    const contractResult =
      contractCheck[0];

    const contractData =
      contractResult.status === "fulfilled"
        ? contractResult.value
        : null;

    const contractFound = Boolean(
      contractData &&
      contractData.contract_address &&
      contractData.bytecode
    );

    addInfo(
      securityInfo,
      "Contract Detection",
      contractFound
        ? "Contract data returned"
        : "Not confirmed"
    );

    const successfulCalls =
      calls.filter(
        item => item.status === "fulfilled"
      ).length;

    addInfo(
      securityInfo,
      "TRC-20 Metadata Checks",
      successfulCalls + " of 4 successful"
    );

    addInfo(
      securityInfo,
      "Ownership Permissions",
      "Not assessed"
    );

    addInfo(
      securityInfo,
      "Minting and Blacklist Controls",
      "Not assessed"
    );

    addInfo(
      securityInfo,
      "Liquidity and Holder Concentration",
      "Not assessed"
    );

    addInfo(
      securityInfo,
      "Security Conclusion",
      "Insufficient evidence for a safety rating"
    );

    const warning =
      document.createElement("p");

    warning.className = "warning";

    warning.textContent =
      "⚠️ Successful metadata checks do not " +
      "prove a token is safe. This scanner " +
      "does not perform a contract audit.";

    securityInfo.appendChild(warning);

    const explorerLink =
      document.createElement("a");

    explorerLink.href =
      "https://tronscan.org/#/contract/" +
      encodeURIComponent(address);

    explorerLink.target = "_blank";

    explorerLink.rel =
      "noopener noreferrer";

    explorerLink.textContent =
      "🔗 View contract on TRONSCAN";

    explorerInfo.appendChild(explorerLink);

    results.hidden = false;

    setStatus(
      "✅ Research completed. Review all warnings.",
      "success"
    );

  } catch (error) {

    setStatus(
      "❌ " + error.message +
      " Check the address and try again.",
      "error"
    );

  } finally {

    button.disabled = false;

  }
}

</script>

</body>
</html>
